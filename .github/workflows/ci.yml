name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/scrapling/requirements.txt
      - run: make fmt-check
      - run: go mod tidy
      - run: git diff --exit-code go.mod go.sum
      - name: Test pinned Scrapling sidecar
        run: |
          python -m pip install --requirement deploy/scrapling/requirements.txt
          python -m playwright install --with-deps chromium
          python -m unittest discover -s deploy/scrapling -p 'test_*.py'
      - name: Build Scrapling sidecar image
        run: docker build --tag fetchmark-scrapling:ci deploy/scrapling
      - name: Smoke Scrapling sidecar image
        run: |
          container_id="$(docker run --detach --rm fetchmark-scrapling:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1
      - name: Validate OpenAPI
        run: go run github.com/getkin/kin-openapi/cmd/validate@v0.140.0 docs/openapi.yaml
      - name: Validate compose configs
        env:
          FM_API_KEYS: ci-api-key
          FM_ADMIN_API_KEYS: ""
          FM_SEARXNG_URL: https://searxng.example.invalid
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          FM_RENDERER_TOKEN=ci-render-token FM_RENDERER_URL=http://chromium:3000/content docker compose -f deploy/docker-compose.yml --profile render config --quiet
          docker compose -f deploy/docker-compose.external.yml config --quiet
          FM_RENDERER_TOKEN=ci-render-token FM_RENDERER_URL=http://chromium:3000/content docker compose -f deploy/docker-compose.external.yml --profile render config --quiet
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out -count=1 ./...
      - run: go build ./cmd/fetchmark
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - run: govulncheck ./...
