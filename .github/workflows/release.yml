name: release

# Builds multi-arch images and publishes to GHCR on any v*.*.* tag.
# The main branch also produces a rolling `ghcr.io/<owner>/fetchmark:main`
# tag so integrators can pin to a known commit in staging.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches OpenAPI version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          openapi_version="$(awk '$0 == "info:" { in_info = 1; next } in_info && $1 == "version:" { gsub(/"/, "", $2); print $2; exit }' docs/openapi.yaml)"
          test "$openapi_version" = "${RELEASE_TAG#v}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/scrapling/requirements.txt

      - name: Format
        run: make fmt-check

      - name: Module tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Validate OpenAPI
        run: go run github.com/getkin/kin-openapi/cmd/validate@v0.140.0 docs/openapi.yaml

      - name: Validate compose configs
        env:
          FM_API_KEYS: ci-api-key
          FM_ADMIN_API_KEYS: ""
          FM_SEARXNG_URL: https://searxng.example.invalid
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          FM_RENDERER_TOKEN=ci-render-token FM_RENDERER_URL=http://chromium:3000/content docker compose -f deploy/docker-compose.yml --profile render config --quiet
          docker compose -f deploy/docker-compose.external.yml config --quiet
          FM_RENDERER_TOKEN=ci-render-token FM_RENDERER_URL=http://chromium:3000/content docker compose -f deploy/docker-compose.external.yml --profile render config --quiet

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Test pinned Scrapling sidecar
        run: |
          python -m pip install --requirement deploy/scrapling/requirements.txt
          python -m playwright install --with-deps chromium
          python -m unittest discover -s deploy/scrapling -p 'test_*.py'

      - name: Build
        run: go build ./cmd/fetchmark

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-fetchmark
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short,enable=${{ github.ref_type == 'branch' }}

      - id: build-fetchmark
        name: Build and publish untagged Fetchmark candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta-fetchmark.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=fetchmark
          cache-to: type=gha,mode=max,scope=fetchmark

      - id: meta-scrapling
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-scrapling
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short,enable=${{ github.ref_type == 'branch' }}

      - id: build-scrapling
        name: Build and publish untagged Scrapling candidate
        uses: docker/build-push-action@v6
        with:
          context: deploy/scrapling
          file: deploy/scrapling/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }}-scrapling,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta-scrapling.outputs.labels }}
          cache-from: type=gha,scope=scrapling
          cache-to: type=gha,mode=max,scope=scrapling

      - name: Smoke untagged Scrapling candidate on both release platforms
        env:
          SCRAPLING_CANDIDATE: ghcr.io/${{ github.repository }}-scrapling@${{ steps.build-scrapling.outputs.digest }}
        run: |
          smoke_platform() {
            platform="$1"
            container_id="$(docker run --detach --platform "$platform" "$SCRAPLING_CANDIDATE")"
            for _ in $(seq 1 90); do
              if ! status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"; then
                docker logs "$container_id" || true
                docker rm --force "$container_id" >/dev/null 2>&1 || true
                return 1
              fi
              state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
              if [ "$state" = exited ] || [ "$state" = dead ]; then
                docker logs "$container_id" || true
                docker rm --force "$container_id" >/dev/null 2>&1 || true
                return 1
              fi
              if [ "$status" = healthy ]; then
                docker rm --force "$container_id" >/dev/null
                docker image rm --force "$SCRAPLING_CANDIDATE" >/dev/null
                return 0
              fi
              if [ "$status" = unhealthy ]; then
                docker logs "$container_id"
                docker rm --force "$container_id" >/dev/null
                return 1
              fi
              sleep 2
            done
            docker logs "$container_id"
            docker rm --force "$container_id" >/dev/null
            return 1
          }
          smoke_platform linux/amd64
          smoke_platform linux/arm64

      - name: Promote validated candidates to release tags
        env:
          FETCHMARK_CANDIDATE: ghcr.io/${{ github.repository }}@${{ steps.build-fetchmark.outputs.digest }}
          FETCHMARK_TAGS: ${{ steps.meta-fetchmark.outputs.tags }}
          SCRAPLING_CANDIDATE: ghcr.io/${{ github.repository }}-scrapling@${{ steps.build-scrapling.outputs.digest }}
          SCRAPLING_TAGS: ${{ steps.meta-scrapling.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "$SCRAPLING_CANDIDATE"
          done <<< "$SCRAPLING_TAGS"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "$FETCHMARK_CANDIDATE"
          done <<< "$FETCHMARK_TAGS"
