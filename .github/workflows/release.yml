name: release

# Builds multi-arch images and publishes to GHCR on any v*.*.* tag.
# The main branch also produces a rolling `ghcr.io/<owner>/fetchmark:main`
# tag so integrators can pin to a known commit in staging.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: make fmt-check

      - name: Module tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Validate OpenAPI
        run: go run github.com/getkin/kin-openapi/cmd/validate@v0.140.0 docs/openapi.yaml

      - name: Validate compose configs
        env:
          FM_API_KEYS: ci-api-key
          FM_ADMIN_API_KEYS: ""
          FM_SEARXNG_URL: https://searxng.example.invalid
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          FM_RENDERER_TOKEN=ci-render-token FM_RENDERER_URL=http://chromium:3000/content docker compose -f deploy/docker-compose.yml --profile render config --quiet
          docker compose -f deploy/docker-compose.external.yml config --quiet
          FM_RENDERER_TOKEN=ci-render-token FM_RENDERER_URL=http://chromium:3000/content docker compose -f deploy/docker-compose.external.yml --profile render config --quiet

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./cmd/fetchmark

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
