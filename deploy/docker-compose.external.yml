services:
  fetchmark:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: fetchmark:dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      FM_LISTEN_ADDR: ":8080"
      FM_SEARXNG_URL: "${FM_SEARXNG_URL:-}"
      FM_SEARXNG_URLS: "${FM_SEARXNG_URLS:-}"
      FM_SEARXNG_COOLDOWN: "${FM_SEARXNG_COOLDOWN:-30s}"
      FM_DISCOVERY_CACHE_TTL: "${FM_DISCOVERY_CACHE_TTL:-30s}"
      FM_DISCOVERY_CACHE_STALE_TTL: "${FM_DISCOVERY_CACHE_STALE_TTL:-2m}"
      FM_DISCOVERY_CACHE_ENTRIES: "${FM_DISCOVERY_CACHE_ENTRIES:-256}"
      FM_DISCOVERY_CACHE_BYTES: "${FM_DISCOVERY_CACHE_BYTES:-16777216}"
      FM_DISCOVERY_CACHE_MAX_ENTRY_BYTES: "${FM_DISCOVERY_CACHE_MAX_ENTRY_BYTES:-1048576}"
      FM_DISCOVERY_REFRESH_TIMEOUT: "${FM_DISCOVERY_REFRESH_TIMEOUT:-30s}"
      FM_DISCOVERY_MAX_INFLIGHT: "${FM_DISCOVERY_MAX_INFLIGHT:-16}"
      FM_ADVANCED_SEARCH_CONCURRENCY: "${FM_ADVANCED_SEARCH_CONCURRENCY:-4}"
      FM_DISCOVERY_PACK_FILE: "${FM_DISCOVERY_PACK_FILE:-}"
      FM_DISCOVERY_ENABLED_PACKS: "${FM_DISCOVERY_ENABLED_PACKS:-general-open,developer,research,knowledge,fresh}"
      FM_DISCOVERY_ENABLED_SOURCES: "${FM_DISCOVERY_ENABLED_SOURCES:-searxng,wikipedia,crossref}"
      FM_DISCOVERY_PRIMARY_SOURCE: "${FM_DISCOVERY_PRIMARY_SOURCE:-searxng}"
      FM_DISCOVERY_PROVIDER_MAX_BODY: "${FM_DISCOVERY_PROVIDER_MAX_BODY:-2097152}"
      FM_OPEN_PACK_REGISTRY_FILE: "${FM_OPEN_PACK_REGISTRY_FILE:-}"
      FM_FEED_INDEX_FILE: "${FM_FEED_INDEX_FILE:-}"
      FM_OFFICIAL_DOC_INDEX_FILE: "${FM_OFFICIAL_DOC_INDEX_FILE:-}"
      FM_FEDERATION_IDENTITY_FILE: "${FM_FEDERATION_IDENTITY_FILE:-}"
      FM_FEDERATION_TRUST_REGISTRY_FILE: "${FM_FEDERATION_TRUST_REGISTRY_FILE:-}"
      FM_FEDERATION_LISTEN_ADDR: "${FM_FEDERATION_LISTEN_ADDR:-}"
      FM_CROSSREF_MAILTO: "${FM_CROSSREF_MAILTO:-}"
      FM_PUBMED_EMAIL: "${FM_PUBMED_EMAIL:-}"
      FM_YACY_URL: "${FM_YACY_URL:-}"
      FM_YACY_RESOURCE: "${FM_YACY_RESOURCE:-local}"
      FM_YACY_ALLOW_INSECURE_HTTP: "${FM_YACY_ALLOW_INSECURE_HTTP:-false}"
      FM_SCRAPLING_URL: "${FM_SCRAPLING_URL:-}"
      FM_SCRAPLING_ALLOW_INSECURE_HTTP: "${FM_SCRAPLING_ALLOW_INSECURE_HTTP:-false}"
      FM_COMPAT_ANSWER_PROVIDER: "${FM_COMPAT_ANSWER_PROVIDER:-}"
      FM_COMPAT_ANSWER_MAX_TOKENS: "${FM_COMPAT_ANSWER_MAX_TOKENS:-512}"
      FM_COMPAT_ANSWER_TIMEOUT: "${FM_COMPAT_ANSWER_TIMEOUT:-30s}"
      FM_REDIS_URL: "${FM_REDIS_URL:-redis://redis:6379/0}"
      FM_API_KEYS: "${FM_API_KEYS:?set FM_API_KEYS}"
      FM_ADMIN_API_KEYS: "${FM_ADMIN_API_KEYS:-}"
      FM_DASHBOARD_USER: "${FM_DASHBOARD_USER:-}"
      FM_DASHBOARD_PASSWORD: "${FM_DASHBOARD_PASSWORD:-}"
      FM_RESPECT_ROBOTS: "${FM_RESPECT_ROBOTS:-true}"
      FM_LOG_LEVEL: "${FM_LOG_LEVEL:-info}"
      FM_FETCH_CONCURRENCY: "${FM_FETCH_CONCURRENCY:-10}"
      FM_PER_HOST_CONCURRENCY: "${FM_PER_HOST_CONCURRENCY:-2}"
      FM_FETCH_TIMEOUT: "${FM_FETCH_TIMEOUT:-8s}"
      FM_HEADER_TIMEOUT: "${FM_HEADER_TIMEOUT:-5s}"
      FM_FETCH_RETRIES: "${FM_FETCH_RETRIES:-2}"
      FM_MAX_BODY_BYTES: "${FM_MAX_BODY_BYTES:-5242880}"
      FM_MAX_DECOMPRESSED_BYTES: "${FM_MAX_DECOMPRESSED_BYTES:-20971520}"
      FM_MAX_REDIRECTS: "${FM_MAX_REDIRECTS:-5}"
      FM_ALLOWED_MIME: "${FM_ALLOWED_MIME:-text/html,application/xhtml+xml}"
      FM_PROXY_URL: "${FM_PROXY_URL:-}"
      FM_USER_AGENT: "${FM_USER_AGENT:-Fetchmark/0.1 (+https://github.com/staticvar/fetchmark)}"
      FM_USER_AGENTS: "${FM_USER_AGENTS:-}"
      FM_CONTACT: "${FM_CONTACT:-}"
      FM_HOST_ALLOWLIST: "${FM_HOST_ALLOWLIST:-}"
      FM_HOST_DENYLIST: "${FM_HOST_DENYLIST:-}"
      FM_CACHE_TTL: "${FM_CACHE_TTL:-1h}"
      FM_MEMORY_CACHE_ENTRIES: "${FM_MEMORY_CACHE_ENTRIES:-512}"
      FM_MEMORY_CACHE_BYTES: "${FM_MEMORY_CACHE_BYTES:-134217728}"
      FM_CACHE_MAX_VALUE_BYTES: "${FM_CACHE_MAX_VALUE_BYTES:-8388608}"
      FM_LOCAL_INDEX_PATH: "${FM_LOCAL_INDEX_PATH:-}"
      FM_LOCAL_CORPUS_MODE: "${FM_LOCAL_CORPUS_MODE:-disabled}"
      FM_LOCAL_CORPUS_MAX_AGE: "${FM_LOCAL_CORPUS_MAX_AGE:-720h}"
      FM_LOCAL_EXPIRY_SWEEP_INTERVAL: "${FM_LOCAL_EXPIRY_SWEEP_INTERVAL:-15m}"
      FM_LOCAL_INDEX_MAX_DOCUMENT_BYTES: "${FM_LOCAL_INDEX_MAX_DOCUMENT_BYTES:-2097152}"
      FM_LOCAL_INDEX_MAX_BYTES: "${FM_LOCAL_INDEX_MAX_BYTES:-1073741824}"
      FM_LOCAL_INDEX_MAX_DOCUMENTS: "${FM_LOCAL_INDEX_MAX_DOCUMENTS:-100000}"
      FM_LOCAL_ARTIFACT_PATH: "${FM_LOCAL_ARTIFACT_PATH:-}"
      FM_LOCAL_ARTIFACT_MAX_BYTES: "${FM_LOCAL_ARTIFACT_MAX_BYTES:-1073741824}"
      FM_LOCAL_ARTIFACT_MAX_VALUE_BYTES: "${FM_LOCAL_ARTIFACT_MAX_VALUE_BYTES:-20971520}"
      FM_LOCAL_ARTIFACT_MAX_ENTRIES: "${FM_LOCAL_ARTIFACT_MAX_ENTRIES:-100000}"
      FM_LOCAL_ARCHIVE_MAX_VERSIONS: "${FM_LOCAL_ARCHIVE_MAX_VERSIONS:-100000}"
      FM_LOCAL_ARCHIVE_MAX_VERSIONS_PER_URL: "${FM_LOCAL_ARCHIVE_MAX_VERSIONS_PER_URL:-16}"
      FM_ARTIFACT_CONCURRENCY: "${FM_ARTIFACT_CONCURRENCY:-3}"
      FM_MAX_REQUEST_SOURCE_BYTES: "${FM_MAX_REQUEST_SOURCE_BYTES:-67108864}"
      FM_MAX_REQUEST_OUTPUT_BYTES: "${FM_MAX_REQUEST_OUTPUT_BYTES:-134217728}"
      FM_MAX_RESULTS: "${FM_MAX_RESULTS:-10}"
      FM_RESULTS_CAP: "${FM_RESULTS_CAP:-50}"
      FM_RATE_LIMIT_PER_SEC: "${FM_RATE_LIMIT_PER_SEC:-5}"
      FM_RATE_LIMIT_BURST: "${FM_RATE_LIMIT_BURST:-20}"
      FM_RENDERER_URL: "${FM_RENDERER_URL:-}"
      FM_RENDERER_AUTO: "${FM_RENDERER_AUTO:-false}"
      FM_RENDERER_TIMEOUT: "${FM_RENDERER_TIMEOUT:-20s}"
      FM_RENDERER_MAX_BODY: "${FM_RENDERER_MAX_BODY:-10485760}"
      FM_RENDERER_TOKEN: "${FM_RENDERER_TOKEN:-}"
      FM_RENDERER_EGRESS_PROXY_URL: "${FM_RENDERER_EGRESS_PROXY_URL:-http://fetchmark:8081}"
      FM_RENDERER_PROXY_LISTEN_ADDR: "${FM_RENDERER_PROXY_LISTEN_ADDR:-:8081}"
      FM_SUMMARIZE_DEFAULT_PROVIDER: "${FM_SUMMARIZE_DEFAULT_PROVIDER:-}"
      FM_SUMMARIZE_MAX_TOKENS_CAP: "${FM_SUMMARIZE_MAX_TOKENS_CAP:-4096}"
      FM_SUMMARIZE_MAX_TIMEOUT: "${FM_SUMMARIZE_MAX_TIMEOUT:-120s}"
      FM_SUMMARIZE_MAX_INSTRUCTIONS_LEN: "${FM_SUMMARIZE_MAX_INSTRUCTIONS_LEN:-4000}"
      FM_SUMMARIZE_ALLOW_MODEL_OVERRIDE: "${FM_SUMMARIZE_ALLOW_MODEL_OVERRIDE:-false}"
      FM_SUMMARIZE_ALLOW_PROVIDER_OVERRIDE: "${FM_SUMMARIZE_ALLOW_PROVIDER_OVERRIDE:-false}"
      FM_SUMMARIZE_ALLOW_THINKING_OVERRIDE: "${FM_SUMMARIZE_ALLOW_THINKING_OVERRIDE:-false}"
      FM_SUMMARIZE_OPENAI_BASE_URL: "${FM_SUMMARIZE_OPENAI_BASE_URL:-}"
      FM_SUMMARIZE_OPENAI_API_KEY: "${FM_SUMMARIZE_OPENAI_API_KEY:-}"
      FM_SUMMARIZE_OPENAI_MODEL: "${FM_SUMMARIZE_OPENAI_MODEL:-}"
      FM_SUMMARIZE_OPENAI_MAX_TOKENS: "${FM_SUMMARIZE_OPENAI_MAX_TOKENS:-}"
      FM_SUMMARIZE_OPENAI_TIMEOUT: "${FM_SUMMARIZE_OPENAI_TIMEOUT:-}"
      FM_SUMMARIZE_OPENAI_THINKING: "${FM_SUMMARIZE_OPENAI_THINKING:-}"
      FM_SUMMARIZE_OPENAI_THINK_EFFORT: "${FM_SUMMARIZE_OPENAI_THINK_EFFORT:-}"
      FM_SUMMARIZE_ANTHROPIC_BASE_URL: "${FM_SUMMARIZE_ANTHROPIC_BASE_URL:-}"
      FM_SUMMARIZE_ANTHROPIC_API_KEY: "${FM_SUMMARIZE_ANTHROPIC_API_KEY:-}"
      FM_SUMMARIZE_ANTHROPIC_MODEL: "${FM_SUMMARIZE_ANTHROPIC_MODEL:-}"
      FM_SUMMARIZE_ANTHROPIC_MAX_TOKENS: "${FM_SUMMARIZE_ANTHROPIC_MAX_TOKENS:-}"
      FM_SUMMARIZE_ANTHROPIC_TIMEOUT: "${FM_SUMMARIZE_ANTHROPIC_TIMEOUT:-}"
      FM_SUMMARIZE_ANTHROPIC_THINKING: "${FM_SUMMARIZE_ANTHROPIC_THINKING:-}"
      FM_SUMMARIZE_ANTHROPIC_THINK_BUDGET: "${FM_SUMMARIZE_ANTHROPIC_THINK_BUDGET:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - renderer
    volumes:
      - "${FM_OFFICIAL_DOC_INDEX_HOST_DIR:-./official-docs}:/etc/fetchmark/official-docs:ro"
      - fetchmark-data:/var/lib/fetchmark

  crawler:
    image: fetchmark:dev
    profiles: ["crawl"]
    restart: "no"
    entrypoint: ["/fetchmark-crawl"]
    command: ["-once"]
    environment:
      FM_CRAWLER_CONFIG_FILE: /etc/fetchmark/crawler.json
      FM_CRAWLER_STATE_PATH: /var/lib/fetchmark-crawler/frontier.db
      FM_CRAWLER_FETCHMARK_URL: http://fetchmark:8080
      FM_CRAWLER_ADMIN_API_KEY: "${FM_CRAWLER_ADMIN_API_KEY:-}"
      FM_CRAWLER_HTTP_TIMEOUT: "${FM_CRAWLER_HTTP_TIMEOUT:-90s}"
    depends_on:
      fetchmark:
        condition: service_started
    volumes:
      - ./crawler.json:/etc/fetchmark/crawler.json:ro
      - fetchmark-crawler-data:/var/lib/fetchmark-crawler

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromium:
    image: ghcr.io/browserless/chromium:v2.24.3
    profiles: ["render"]
    restart: unless-stopped
    environment:
      CONCURRENT: "4"
      TIMEOUT: "30000"
      TOKEN: "${FM_RENDERER_TOKEN:-}"
    command:
      - /bin/sh
      - -lc
      - ': "$${TOKEN:?set FM_RENDERER_TOKEN when renderer is enabled}" && exec /usr/src/app/start.sh'
    expose:
      - "3000"
    networks:
      - renderer

networks:
  renderer:
    internal: true

volumes:
  fetchmark-data:
  fetchmark-crawler-data:
